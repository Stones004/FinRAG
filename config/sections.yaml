# Heading and marker patterns for PDFs.
# M02 created this file with only transcript_markers.qa_start (needed by the transcript
# link-only check). M03 adds the statement patterns and M08 adds the narrative sections and the
# remaining transcript_markers keys; extend this file, do not replace it.
transcript_markers:
  # Derived 2026-10-11 from 4 real transcripts (HDFC Bank Q4 FY26 / Q1 FY27, Netweb Q4 FY26 / Q1 FY27);
  # M08 checked them again on 2026-10-19. Two issuers, both moderator-led: re-check with every new issuer.
  start:             '(?i)earnings\s+conference\s+call[”"]?\s*$'   # end of the title block; everything before it is the exchange cover letter (excluded)
  footer_line:       '^\s*Page\s+\d+\s+of\s+\d+\s*$'                # stripped
  speaker_line:      '^(?P<speaker>[A-Z][A-Za-z.''-]*(?:\s+[A-Z][A-Za-z.''-]*){0,3}):(?:\s+(?P<text>\S.*))?$'   # "Name: text"; first-name-only speakers occur ("Pranav:", "Omkar:")
  not_speaker:       ["Sub", "SUB", "Scrip Code", "Scrip code", "Date", "Encl", "Regd. Office", "CIN", "Email", "Website", "MANAGEMENT", "MODERATOR"]
  generic_speakers:  { moderator: ["Moderator"], management: ["Management"] }
  participant_block: '(?P<group>MANAGEMENT|MODERATOR):'
  participant_entry: '(?i)\b(?:MR|MS|MRS|DR)\.\s+'
  participant_sep:   '(?:\s+|^)[\u2013\u2014\-\ufffd]+(?:\s+|$)|\s*[\u2013\u2014\ufffd]+\s*'   # the dash is extracted as U+FFFD / "--" / lost depending on PDF; a hyphen inside a word ("PART-TIME") is not a separator
  analyst_intro:     '(?is)question\s+is\s+from\s+the\s+line\s+of\s+(?P<name>[A-Z][^,.]*?)(?:\s+from\s+(?:the\s+)?|\s*,\s*)(?P<firm>[^.]*?)\s*(?:\.|Please go ahead|$)'
  qa_start:          '(?i)question\s+is\s+from\s+the\s+line\s+of'     # first match (in any speaker's turn) starts Q&A, at the start of that turn
  qa_end:            '(?i)(?:hand|handing)\s+(?:the\s+)?(?:conference|call|floor)\s+(?:back\s+)?over\s+to\s+.{0,80}closing|concludes\s+this\s+conference'
  operator_phrases:  ["go ahead", "unmute", "proceed with your question", "your line", "request you", "return to the question queue", "next question", "thank you"]   # operator sentences that are not a lost analyst question
  furniture_lines:   ["Classification - Internal"]   # page furniture that is not a repeated header (stripped wherever it appears)
  furniture_head_lines: 6          # a line repeated in the first N lines of at least furniture_min_share of the pages is a page header
  furniture_min_share: 0.5
  lost_label_min_words: 12         # words left in an operator/IR turn after an analyst intro that mean the analyst's label was lost

# --- M08: sections of results documents (v1) and annual reports (DEFERRED) ---
narrative_sections:
  # Used on results PDFs now. A heading is a whole short line; see docs/modules/M08_narrative.md.
  results_notes:
    heading:  ['^\s*(?:other\s+)?not(?:es?|\W?s)\s*[:;.,]?\s*$', '^\s*notes\s+to\s+the\s+(?:standalone\s+|consolidated\s+)?(?:financial\s+)?results']
  auditor_report:
    heading:  ['^\s*(?:independent\s+)?auditors?.{0,3}s?\s+(?:limited\s+review\s+)?report(?:\s+on\b.{0,120})?\s*:?\s*$', '^\s*review\s+report\s*$', 'limited\s+review\s+report\s+on\b']
    end:      ['\bUDIN\b']                  # the signature page closes the report (inclusive)
  # Notes continue over pages without a heading (numbered items), also after a statement page has interrupted
  # them. An unclassified page with at least min_lines numbered lines continues the notes, unless an
  # annexure / news-release page has been seen since the last heading.
  notes_continuation:
    pattern: '^\s*\d{1,3}[.)]?\s+[A-Z][a-z]{2,}'
    min_lines: 2
  # A page with one of these among its first `head_lines` non-blank lines is not notes or auditor text
  # (covering letters, annexures, news releases); it closes the running span and is skipped.
  not_narrative_head:
    head_lines: 8
    patterns: ['^\s*annexure\b', '\bnews\s+release\b', '^\s*(?:sub|subject)\b.{0,3}[:|]']
  # A press release (HDFC appends its news release: asset quality, deposits, advances) runs from the
  # page whose first lines match to the end of the document. Its pages are indexed as section
  # press_release with basis "unknown"; the tables inside it (statement pages) are not, they repeat
  # the results.
  press_release:
    start: ['\bnews\s+release\b']
  # DEFERRED (annual reports are not indexed in v1): re-enable with narrative.index_annual_reports for the shenanigans layer.
  mdna:              ["management discussion and analysis", "management's discussion"]
  directors_report:  ["directors' report", "board's report"]
  caro:              ["annexure to the independent auditor", "companies (auditor's report) order"]
  notes:             ["notes to the financial statements", "notes forming part"]
  risk:              ["risk management", "risks and concerns"]
  corporate_governance: ["report on corporate governance"]
  related_party:     ["related party transactions", "related party disclosures"]
  contingent:        ["contingent liabilities"]

# XBRL text blocks that are indexed (entity-total blocks only): concept -> section. Names as seen in the real filings.
xbrl_text_blocks:
  'in-capmkt:DisclosureOfNotesOnFinancialResultsExplanatoryTextBlock': results_notes
  'in-capmkt:DisclosureOfNotesOnSegmentsExplanatoryTextBlock': segment_notes
  'in-capmkt:DisclosureOfNotesOnAssetsAndLiabilitiesExplanatoryTextBlock': assets_liabilities_notes
  'in-capmkt:DeclarationOfUnmodifiedOpinionOrStatementOnImpactOfAuditQualification': audit_opinion

# --- M03: statement pages and table headers (starting patterns; extend from real filings) ---
# All patterns are case-insensitive regular expressions searched in the page text.
statement_pages:
  profit_and_loss:
    - 'statement\s+of\s+(?:standalone\s+|consolidated\s+)?(?:audited\s+)?(?:profit|financial\s+results)'
    - 'total\s+income'
    - 'profit\s+before\s+(?:exceptional\s+items\s+and\s+)?tax'
    - 'earnings\s+per\s+(?:equity\s+)?share'
  balance_sheet:
    - 'balance\s+sheet'
    - 'statement\s+of\s+assets\s+and\s+liabilities'
    - 'total\s+equity\s+and\s+liabilities'
    - 'total\s+assets'
  cash_flow:
    - 'cash\s+flows?'
    - 'cash\s+generated\s+from\s+operations'
    - 'net\s+cash\s+(?:flows?\s+)?(?:generated\s+from|used\s+in|from)'
  segment:
    - 'segment\s+(?:revenue|results?|assets|liabilities|information)'
    - 'reportable\s+segments?'
basis_patterns:
  consolidated: ['consolidated']
  standalone: ['standalone', 'stand[\s-]*alone']
unit_patterns:   # regex -> unit key in settings.units.multipliers
  # The rupee sign often comes out as a backtick or "Rs" in PDF text, so a currency mark may sit
  # between "in" and the unit ("Amount in ` millions").
  crore:   ['in\s*(?:[₹`]|rs\.?|inr)?\s*crores?', '[₹`]\s*crores?']
  lakh:    ['in\s*(?:[₹`]|rs\.?|inr)?\s*lakhs?', '[₹`]\s*lakhs?']
  million: ['in\s*(?:[₹`]|rs\.?|inr)?\s*millions?', '[₹`]\s*millions?']
  thousand: ['in\s*(?:[₹`]|rs\.?|inr)?\s*thousands?', 'in\s*(?:[₹`]|rs\.?|inr)?\s*''000']

# Column headers of a statement table (read by pdf_tables).
table_header:
  date_patterns:   # named groups: d (day), y (year), and m (month number) or mon (month name)
    - '(?P<d>\d{1,2})\s*[-./]\s*(?P<m>\d{1,2})\s*[-./]\s*(?P<y>\d{4})'
    - '(?P<d>\d{1,2})(?:st|nd|rd|th)?\s+(?P<mon>[A-Za-z]{3,9})\.?,?\s+(?P<y>\d{4})'
    - '(?P<mon>[A-Za-z]{3,9})\.?\s+(?P<d>\d{1,2})(?:st|nd|rd|th)?\s*,?\s*(?P<y>\d{4})'
  period_kinds:    # first match wins, so list the more specific kinds first; type = PeriodType
    - {type: 9M, patterns: ['nine\s+months?', '9\s*months?']}
    - {type: H,  patterns: ['half[\s-]*year', 'six\s+months?', '6\s*months?']}
    - {type: Q,  patterns: ['quarter']}
    - {type: FY, patterns: ['year\s+ended', 'year\s+ending', 'full\s+year', 'financial\s+year']}
  months_in_kind: {Q: 3, H: 6, 9M: 9, FY: 12}

# Sum checks inside one statement column (read by pdf_tables). Each role is a list of rows; a row
# is given by label regexes in priority order (the first regex that matches a row wins). A cell
# that would make a failing check hold if it were sum_shift_factor times larger or smaller (an OCR
# decimal slip: "304.79" read as "30479") gets parsing.pdf.sum_shift_confidence.
column_checks:
  - id: total_income
    statement: profit_and_loss
    total: ['^total\s+income\b']
    parts:
      - ['^revenue\s+from\s+operations\b', '^(?:net\s+)?sales\b']
      - ['^other\s+income\b']
  - id: profit_after_tax
    statement: profit_and_loss
    total: ['^(?:net\s+)?profit\s*(?:/\s*\(?loss\)?\s*)?for\s+the\s+(?:period|year)\b']
    parts:
      - ['^profit\s*(?:/\s*\(?loss\)?\s*)?before\s+tax\b']
    minus:
      - ['^total\s+tax\s+expenses?\b', '^tax\s+expenses?\s*$']
    optional_parts:
      - ['^share\s+of\s+(?:net\s+)?(?:profit|loss).*associates']
      - ['^profit\s*(?:/\s*\(?loss\)?\s*)?from\s+discontinued']
  - id: balance_sheet
    statement: balance_sheet
    total: ['^total\s+equity\s+and\s+liabilities\b', '^total\s+capital\s+and\s+liabilities\b']
    parts:
      - ['^total\s+assets\b']

# Row labels that wrap over two lines: a label-only line joins the next numeric row's label when
# it ends in one of these words (or in a comma / hyphen) or the next line starts in lower case.
table_labels:
  continuation_words: ['and', 'or', 'of', 'the', 'to', 'for', 'in', 'on', 'from', 'with', 'by', 'a', 'an', 'at', 'under']

