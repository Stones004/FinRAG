# =============================================================================
# FinRAG settings — the ONLY place for tunable values.
# Code reads this through finrag.core.config. Do not hardcode any of these.
# Values marked [VERIFY] are placeholders to confirm before relying on them.
# =============================================================================

app:
  name: FinRAG
  timezone: Asia/Kolkata
  log_level: INFO

paths:
  data_dir: ./data
  db: ./data/finrag.db
  raw_store: ./data/raw
  processed: ./data/processed
  indexes: ./data/indexes
  reference: ./data/reference          # securities master files
  inbox: ./data/inbox                  # manual drop folder for filings
  logs: ./data/logs
  # registries (data files, owned by modules)
  watchlist: ./config/watchlist.yaml
  taxonomy: ./config/taxonomy.yaml
  metrics: ./config/metrics.yaml
  validation_rules: ./config/validation_rules.yaml
  sections: ./config/sections.yaml
  intents: ./config/intents.yaml
  prompts: ./config/prompts            # versioned prompt templates: prompts/<version>/*.txt

fiscal:
  fy_start_month: 4                    # April
  fy_label_format: "FY{yy}"            # FY26 = Apr 2025 – Mar 2026

history:
  years_back: 5

defaults:
  basis: consolidated                  # consolidated | standalone
  currency: INR
  display_unit: crore
  display_decimals: 2

units:
  # multiplier to convert a reported scale into rupees
  multipliers:
    rupees: 1
    thousand: 1000
    lakh: 100000
    million: 1000000
    crore: 10000000
    billion: 1000000000

watchlist:
  default_sector_type: general         # general | bank | nbfc | insurance
  allowed_sector_types: [general, bank, nbfc, insurance]
  name_match_min_score: 90             # rapidfuzz score to accept a name match

sources:
  enabled: [local_inbox]               # add nse / bse only after access terms are confirmed
  securities_master:
    nse_file: nse_equity_list.csv      # downloaded 2026-10-11 (NSE EQUITY_L.csv)
    bse_file: bse_equity_list.csv      # [VERIFY]
  nse:
    base_url: ""                       # [VERIFY] fill after access check
    requests_per_minute: 20
    timeout_s: 30
    retries: 3
    backoff_s: 5
    user_agent: ""                     # [VERIFY]
  bse:
    base_url: ""                       # [VERIFY]
    requests_per_minute: 20
    timeout_s: 30
    retries: 3
    backoff_s: 5
    user_agent: ""                     # [VERIFY]
  filing_types: [financial_results, annual_report]

parsing:
  pdf:
    ocr_enabled: true
    ocr_lang: eng
    ocr_dpi: 300
    min_text_chars_for_native: 200     # below this a page is treated as scanned
    min_text_quality: 0.85             # share of recognisable tokens; below this re-OCR the page
    min_table_confidence: 0.7          # below this a table goes to review_queue
    statement_page_min_score: 2        # keyword hits needed to classify a statement page

normalize:
  fuzzy_suggest_min_score: 85          # fuzzy label matches are only SUGGESTED in the review queue

restatement:
  relative_tolerance: 0.005            # 0.5%
  absolute_tolerance_inr: 10000000     # ₹1 crore; flag only if BOTH are exceeded

validation:
  relative_tolerance: 0.001
  absolute_tolerance_inr: 10000000

metrics:
  version_policy: latest               # latest | pinned
  pinned_versions: {}                  # metric_id: version, used when version_policy = pinned

narrative:
  chunk_tokens: 400
  chunk_overlap_tokens: 60
  min_chunk_tokens: 40
  embedding_model: BAAI/bge-small-en-v1.5   # [VERIFY] runs locally on your machine
  embedding_batch_size: 32
  vector_backend: numpy                # numpy | faiss
  retrieval:
    top_k_bm25: 20
    top_k_dense: 20
    rrf_k: 60
    final_k: 5
    reranker_enabled: false
    reranker_model: ""                 # [VERIFY] if enabled

query:
  intent:
    fuzzy_min_score: 80
    shortlist_size: 8
    llm_fallback_enabled: true
    auto_proceed_threshold: 0.85       # above: answer and show interpretation
    clarify_threshold: 0.60            # below: ask the user
    default_period: latest_available   # used when the question names no period; always shown
    multi_entity_enabled: false        # cross-company comparison is out of scope for v1
  answer:
    max_facts_in_prompt: 30
    max_chunks_in_prompt: 5
    require_citation_per_sentence: true
    numeric_check_enabled: true

llm:
  provider: ollama
  base_url: http://localhost:11434
  model: llama3.1:8b                   # [VERIFY] pick after checking hardware
  temperature: 0
  num_ctx: 8192
  timeout_s: 180
  retries: 2
  prompt_version: v1

scheduler:
  results_season_months: [1, 2, 4, 5, 7, 8, 10, 11]
  poll_interval_hours_season: 4
  poll_interval_hours_offseason: 24
  max_parallel_jobs: 2

alerts:
  channels: [log]                      # log | email
  email:
    smtp_host: ""
    smtp_port: 587
    from_addr: ""
    to_addr: ""
    # password via env var FINRAG_ALERTS__EMAIL__PASSWORD

ui:
  show_blocked_metrics: true           # show greyed with reason
  show_interpretation: true            # always show parsed intent above answers
  default_years_shown: 5

logging:
  json_logs: true
  query_log_enabled: true
