# =============================================================================
# FinRAG settings — the ONLY place for tunable values.
# Code reads this through finrag.core.config. Do not hardcode any of these.
# Values marked [VERIFY] are placeholders to confirm before relying on them.
# =============================================================================

app:
  name: FinRAG
  timezone: Asia/Kolkata
  log_level: INFO

paths:
  data_dir: ./data
  db: ./data/finrag.db
  raw_store: ./data/raw
  processed: ./data/processed
  indexes: ./data/indexes
  reference: ./data/reference          # securities master files
  inbox: ./data/inbox                  # manual drop folder for filings
  inbox_processed: ./data/inbox/_processed   # inbox files already stored in the raw store
  logs: ./data/logs
  # registries (data files, owned by modules)
  watchlist: ./config/watchlist.yaml
  taxonomy: ./config/taxonomy.yaml
  metrics: ./config/metrics.yaml
  validation_rules: ./config/validation_rules.yaml
  sections: ./config/sections.yaml
  intents: ./config/intents.yaml
  prompts: ./config/prompts            # versioned prompt templates: prompts/<version>/*.txt
  vocab_common_en: ./config/vocab/common_en.txt   # common English words, one per line (text-quality score)

fiscal:
  fy_start_month: 4                    # April
  fy_label_format: "FY{yy}"            # FY26 = Apr 2025 – Mar 2026

history:
  years_back: 5

defaults:
  basis: consolidated                  # consolidated | standalone
  currency: INR
  display_unit: crore
  display_decimals: 2

units:
  # multiplier to convert a reported scale into rupees
  multipliers:
    rupees: 1
    thousand: 1000
    lakh: 100000
    million: 1000000
    crore: 10000000
    billion: 1000000000

watchlist:
  default_sector_type: general         # general | bank | nbfc | insurance
  allowed_sector_types: [general, bank, nbfc, insurance]
  name_match_min_score: 90             # rapidfuzz score to accept a name match
  suggest_max: 5                       # max suggestions shown when no exact or fuzzy match is found
  suggest_min_score: 60                # token_set_ratio floor for a name to be suggested

sources:
  enabled: [local_inbox]               # add nse / bse only after access terms are confirmed
  securities_master:
    nse_file: nse_equity_list.csv      # downloaded 2026-10-11 (NSE EQUITY_L.csv)
    bse_file: bse_equity_list.csv      # [VERIFY]
  nse:
    base_url: ""                       # [VERIFY] fill after access check
    requests_per_minute: 20
    timeout_s: 30
    retries: 3
    backoff_s: 5
    user_agent: ""                     # [VERIFY]
    # Endpoint paths recorded 2026-10-12 (tests/fixtures/nse/); joined to base_url.
    endpoints:
      integrated_filing_results: /api/integrated-filing-results
      legacy_financial_results: /api/corporates-financial-results
      annual_reports: /api/annual-reports
      corporate_announcements: /api/corporate-announcements
    integrated_filing_type: "Integrated Filing- Financials"
    integrated_from_period_end: 2025-03-31   # results for periods ending on/after this are under integrated filings
    legacy_result_periods: [Quarterly]       # values of the old API's `period` parameter to query
    transcript_desc: "Analysts/Institutional Investor Meet/Con. Call Updates"
    transcript_text_marker: transcript       # case-insensitive, in attchmntText
    announcement_window_days: 90             # [VERIFY] longest from/to range requested per announcements call
  bse:
    base_url: ""                       # [VERIFY]
    requests_per_minute: 20
    timeout_s: 30
    retries: 3
    backoff_s: 5
    user_agent: ""                     # [VERIFY]
  filing_types: [financial_results, annual_report, earnings_call_transcript]

ingestion:
  transcript_link_only_max_pages: 2    # a transcript file this short with no Q&A text is a cover letter only

parsing:
  ocr:
    ocr_enabled: true
    ocr_lang: eng
    ocr_dpi: 300
    backend: tesseract                 # tesseract | chandra
    tesseract_cmd: ""                   # path to tesseract.exe; blank = use PATH
    # Table rules (long dark lines) make Tesseract skip the text inside ruled header boxes, so lines
    # at least this long (points) are erased from the page image first. 0 = leave the image alone.
    rule_min_length_pt: 24
    # One OCR pass per entry. The first pass gives the page text and the first words; each later
    # pass only adds words that do not overlap one already found.
    tesseract_passes: ["--psm 3", "--psm 11"]
    chandra:
      base_url: http://localhost:1234/v1   # LM Studio OpenAI-compatible server
      model: ""                        # [VERIFY] e.g. chandra-ocr-2 Q4_K_M/Q6_K GGUF loaded in LM Studio
      timeout_s: 120
      max_image_px: 2000
  pdf:
    min_text_chars_for_native: 200     # below this a page is treated as scanned
    min_text_quality: 0.70             # share of recognisable tokens; below this re-OCR the page (calibrated 2026-10-12, see PROGRESS)
    min_table_confidence: 0.7          # below this a table goes to review_queue
    unit_inherited_confidence_penalty: 0.05  # taken off a fact whose unit line came from an earlier statement page
    format_outlier_confidence: 0.3     # cap for a number whose decimal places differ from the table's usual (OCR drops points)
    sum_shift_confidence: 0.3          # cap for a cell that would make a column sum-check hold if it were 100x larger or smaller (an OCR decimal slip the format check cannot see)
    sum_shift_factor: 100              # the shift tried on each cell of a column identity that fails
    sum_check_abs_tolerance: 0.05      # a column identity (e.g. profit before tax - tax = profit) holds within this many printed units ...
    sum_check_rel_tolerance: 0.005     # ... or this share of its total (rounding of the printed figures)
    statement_page_min_score: 2        # keyword hits needed to classify a statement page
    quality_min_token_len: 3           # text-quality score counts alphabetic tokens at least this long
    row_tolerance_pt: 4.0              # words this close vertically (points) are one table row
    column_tolerance_pt: 10.0          # numbers whose right edges are this close (points) share a column
    min_table_rows: 3                  # numeric rows needed to read a page as a table
    column_min_support_ratio: 0.25     # a column needs this share of the best column's numbers (drops stray numbers)
    header_max_lines: 8                # lines above the first numeric row scanned for column headers
    basis_scan_lines: 15               # first lines of a page searched for standalone / consolidated

normalize:
  fuzzy_suggest_min_score: 85          # fuzzy label matches are only SUGGESTED in the review queue

restatement:
  relative_tolerance: 0.005            # 0.5%
  absolute_tolerance_inr: 10000000     # ₹1 crore; flag only if BOTH are exceeded

validation:
  relative_tolerance: 0.001            # a check fails only if BOTH tolerances are exceeded
  absolute_tolerance_inr: 10000000     # INR concepts only
  cross_source:                        # XBRL vs PDF/OCR comparison and its classifier (M06)
    rounding_inr: 10000                # a difference up to this is rounding of the printed figure (millions to 2 decimals)
    min_shifted_keys: 3                # at least this many differing lines make a consistent shift, not a one-cell slip
    decimal_shift_max_power: 3         # PDF/OCR value = XBRL value x 10^k (k = 1..this) reads as a dropped/added decimal point

metrics:
  version_policy: latest               # latest | pinned
  pinned_versions: {}                  # metric_id: version, used when version_policy = pinned
  decimal_precision: 28                # significant digits of a metric calculation (Decimal context)

narrative:
  chunk_tokens: 400
  chunk_overlap_tokens: 60
  min_chunk_tokens: 40
  embedding_model: BAAI/bge-small-en-v1.5   # one-time download approved 2026-10-19; runs locally; change here to swap models (re-run `narrative index --rebuild`)
  embedding_device: cpu                # cpu | cuda; GPU is reserved for OCR (ingestion) and the LLM (query time)
  embedding_batch_size: 32
  embedding_query_prefix: "Represent this sentence for searching relevant passages: "   # BGE query instruction; "" for models without one
  vector_backend: numpy                # numpy only (faiss dropped at the M08 review)
  index_annual_reports: false          # deferred (2026-10-13): annual reports stay in the raw store, not indexed; true = re-enable for the shenanigans layer
  annual_report_sections_include: [mdna, directors_report, auditor_report, caro, notes, related_party, contingent]
  log_skipped_sections: true           # record skipped annual-report page ranges in the per-filing summary
  retrieval:
    top_k_bm25: 20
    top_k_dense: 20
    rrf_k: 60
    final_k: 5
    reranker_enabled: false
    reranker_model: ""                 # [VERIFY] if enabled

query:
  intent:
    fuzzy_min_score: 80
    shortlist_size: 8
    llm_fallback_enabled: true
    auto_proceed_threshold: 0.85       # above: answer and show interpretation
    clarify_threshold: 0.60            # below: ask the user
    default_period: latest_available   # used when the question names no period; always shown
    multi_entity_enabled: false        # cross-company comparison is out of scope for v1
  answer:
    max_facts_in_prompt: 30
    max_chunks_in_prompt: 5
    require_citation_per_sentence: true
    numeric_check_enabled: true

llm:
  provider: openai_compatible          # any OpenAI-compatible local server; LM Studio by default (Ollama also works at its own /v1 URL)
  base_url: http://localhost:1234/v1
  model: ""                            # [VERIFY] 3–4B instruct model, Q4–Q5 GGUF
  temperature: 0
  num_ctx: 8192
  timeout_s: 180
  retries: 2
  prompt_version: v1

scheduler:
  results_season_months: [1, 2, 4, 5, 7, 8, 10, 11]
  poll_interval_hours_season: 4
  poll_interval_hours_offseason: 24
  max_parallel_jobs: 2

alerts:
  channels: [log]                      # log | email
  email:
    smtp_host: ""
    smtp_port: 587
    from_addr: ""
    to_addr: ""
    # password via env var FINRAG_ALERTS__EMAIL__PASSWORD

ui:
  show_blocked_metrics: true           # show greyed with reason
  show_interpretation: true            # always show parsed intent above answers
  default_years_shown: 5

logging:
  json_logs: true
  query_log_enabled: true
