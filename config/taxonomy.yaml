  cwip:
    label: Capital work-in-progress
    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:CapitalWorkInProgress"] }
    labels: ["Capital work-in-progress"]
  intangible_assets:
    label: Other intangible assets
    statement: balance_sheet
    period_kind: instant
    unit: INR
