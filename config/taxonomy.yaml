    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:BorrowingsCurrent"] }
  lease_liabilities:
    label: Lease liabilities
    description: "TODO: no lease-liability QName is tagged in any real filing seen so far, so there is no XBRL mapping; add one when a filing carries it."
    statement: balance_sheet
    period_kind: instant
    unit: INR
  trade_payables_current:
    label: Trade payables (current)
    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:TradePayablesCurrent"] }
  trade_payables_noncurrent:
    label: Trade payables (non-current)
