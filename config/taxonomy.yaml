      banking: ["in-capmkt:CashFlowsFromUsedInFinancingActivities"]
    labels: ["Net cash used in financing activities"]
  capex_ppe:
    label: Purchase of property, plant and equipment
    description: Outflow reported as a positive number. The banking family tags tangible assets.
    statement: cash_flow
    period_kind: duration
    unit: INR
    sign_convention: outflow_positive
    pdf_sign: negate   # the PDF prints outflows as negatives
    xbrl_concepts:
      indas: ["in-capmkt:PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities"]
