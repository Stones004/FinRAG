  bank_reserves_and_surplus:
    label: Reserves and surplus
    statement: balance_sheet
    period_kind: instant
    unit: INR
    sectors: [bank]
    xbrl_concepts: { banking: ["in-capmkt:ReservesAndSurplus"] }


# QNames seen in real filings (entity-total facts) that are understood and deliberately not mapped.
# Counted by reason in the stats and in `finrag normalize report`; never queued for review.
# Promote one to `concepts` when a metric needs it.
  bank_operating_profit_before_provisions:
    label: Operating profit before provisions and contingencies
    description: The key bank profitability line, as reported by the bank (not computed by FinRAG).
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    sectors: [bank]
    xbrl_concepts: { banking: ["in-capmkt:OperatingProfitBeforeProvisionAndContingencies"] }
  bank_gross_npa:
    label: Gross non-performing assets
    description: Real values appear only in standalone filings. The consolidated filings tag 0, which is not a disclosure; such zeros are not stored (zero_is_placeholder). A stock measure, never derived from cumulative periods.
    statement: other
    period_kind: duration
    unit: INR
    sectors: [bank]
    zero_is_placeholder: true
    derivable: false
    xbrl_concepts: { banking: ["in-capmkt:GrossNonPerformingAssets"] }
  bank_net_npa:
    label: Net non-performing assets
    description: Tag NonPerformingAssets (HDFC Bank Q1 FY27 standalone - 123.57 bn against gross 358.46 bn, 0.41 % against 1.17 %). Zero in consolidated filings is a placeholder, not stored.
    statement: other
    period_kind: duration
    unit: INR
    sectors: [bank]
    zero_is_placeholder: true
    derivable: false
    xbrl_concepts: { banking: ["in-capmkt:NonPerformingAssets"] }
  bank_gross_npa_ratio:
    label: Gross NPA ratio
    description: Stored as a ratio (0.0117 = 1.17 %). Zero in consolidated filings is a placeholder, not stored.
    statement: other
    period_kind: duration
    unit: RATIO
    sectors: [bank]
    zero_is_placeholder: true
    derivable: false
    xbrl_concepts: { banking: ["in-capmkt:PercentageOfGrossNpa"] }
  bank_net_npa_ratio:
    label: Net NPA ratio
    description: Stored as a ratio (0.0041 = 0.41 %). Zero in consolidated filings is a placeholder, not stored.
    statement: other
    period_kind: duration
    unit: RATIO
    sectors: [bank]
    zero_is_placeholder: true
    derivable: false
    xbrl_concepts: { banking: ["in-capmkt:PercentageOfNpa"] }
  bank_cet1_ratio:
    label: Common equity tier 1 ratio
    description: Stored as a ratio (0.1957 = 19.57 %). Zero in consolidated filings is a placeholder, not stored.
    statement: other
    period_kind: duration
    unit: RATIO
    sectors: [bank]
    zero_is_placeholder: true
    derivable: false
    xbrl_concepts: { banking: ["in-capmkt:CET1Ratio"] }


