    labels: ["Total assets"]
  equity_share_capital:
    label: Equity share capital
    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:EquityShareCapital"] }
  other_equity:
    label: Other equity
    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:OtherEquity"] }
    labels: ["Other equity"]
  total_equity:
    label: Total equity
    statement: balance_sheet
    period_kind: instant
    unit: INR
