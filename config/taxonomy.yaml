    statement: cash_flow
    period_kind: duration
    unit: INR
    xbrl_concepts:
      indas: ["in-capmkt:CashFlowsFromUsedInInvestingActivities"]
      banking: ["in-capmkt:CashFlowsFromUsedInInvestingActivities"]
    labels: ["Net cash used in investing activities"]
  cff:
