    "in-capmkt:DeferredTaxAssetsNet": "balance_sheet_item"
    "in-capmkt:DeferredTaxLiabilitiesNet": "balance_sheet_item"
    "in-capmkt:EquityAttributableToOwnersOfParent": "balance_sheet_item"
    "in-capmkt:IntangibleAssetsUnderDevelopment": "balance_sheet_item"
