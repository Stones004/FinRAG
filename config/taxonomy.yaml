    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:TradeReceivablesCurrent"] }
    labels: ["Trade receivables"]
  trade_receivables_noncurrent:
    label: Trade receivables (non-current)
    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:TradeReceivablesNoncurrent"] }
  cash_and_equivalents:
    label: Cash and cash equivalents
    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:CashAndCashEquivalents"] }
    labels: ["Cash and cash equivalents"]
  other_bank_balances:
    label: Bank balances other than cash and cash equivalents
    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:BankBalanceOtherThanCashAndCashEquivalents"] }
    labels: ["Bank balances other than cash and cash equivalents"]
  current_investments:
    label: Current investments
    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:CurrentInvestments"] }
  total_current_assets:
    label: Total current assets
    statement: balance_sheet
    period_kind: instant
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:CurrentAssets"] }
    labels: ["Total current assets"]
  total_assets:
    label: Total assets
    statement: balance_sheet
    period_kind: instant
