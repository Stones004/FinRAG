# FinRAG taxonomy (M04): canonical concepts, their source mappings, and the QNames that are
# understood but deliberately not mapped (known_unmapped).
#
# Every QName below was seen in a real filing (data/inbox, parsed by M03). Do not add one that has
# not been seen in a real file. Lookups are keyed by (taxonomy family, QName); the family comes from
# filings.taxonomy_family. Mapped facts keep their values exactly as reported (no sign flipping);
# `sign_convention` tells M07 how to read them.
# PDF labels: only labels seen in the real Netweb Q4 FY26 results scan, each checked by value against
# the XBRL revision. A label maps only to a concept of the statement of its page. `pdf_sign: negate`
# converts PDF values to the XBRL convention (the PDF prints outflows as negatives).
version: 1

families: [indas, banking]

# XBRL unit strings (parsed_facts.unit_raw) accepted for each canonical unit.
xbrl_units:
  INR: ["iso4217:INR"]
  INR_PER_SHARE: ["iso4217:INR/xbrli:shares"]
  SHARES: ["xbrli:shares"]
  RATIO: ["xbrli:pure"]

# Reasons a QName can be known but unmapped. `duplicate_of:<concept>` is also allowed.
# These facts stay in parsed_facts; they are counted by reason and never queued for review.
unmapped_reasons:
  cash_flow_adjustment: Reconciling adjustment between profit and operating cash flow (working capital, non-cash items); an input for later signals.
  cash_flow_item: Other cash-flow statement line (investing and financing detail, taxes paid, interest and dividends received).
  income_statement_item: Profit and loss line outside the starter concept list.
  balance_sheet_item: Balance sheet line outside the starter concept list.
  segment: Segment disclosure reported without a dimension; never an entity total.
  related_party: Related-party transaction amount; an input for later signals.
  notes_disclosure: Amount from the notes or other disclosures.
  share_data: Face value or paid-up value of shares.
  bank_disclosure: Bank-only regulatory disclosure (asset quality).
  ratio: Reported ratio or percentage; metrics are computed by M07.
  metadata: Filing metadata that is not a financial value.
  subtotal: Subtotal or total line outside the starter concept list, or a different subtotal from the concept it resembles.
  ocr_merged_label: Section header merged into a line by the OCR layout (label unreliable); the value is only a PDF/OCR duplicate of an XBRL fact.

concepts:
  # ---------------------------------------------------------------- profit and loss
  revenue:
    label: Revenue from operations
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    sectors: [general, nbfc]
    xbrl_concepts: { indas: ["in-capmkt:RevenueFromOperations"] }
    labels: ["Revenue from operations"]
  other_income:
    label: Other income
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:OtherIncome"], banking: ["in-capmkt:OtherIncome"] }
    labels: ["Other income"]
  total_income:
    label: Total income
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:Income"], banking: ["in-capmkt:Income"] }
    labels: ["Total income"]
  cost_of_materials:
    label: Cost of materials consumed
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:CostOfMaterialsConsumed"] }
    labels: ["Cost of materials consumed"]
  purchases_stock_in_trade:
    label: Purchases of stock-in-trade
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:PurchasesOfStockInTrade"] }
  change_in_inventories:
    label: Changes in inventories of finished goods, work-in-progress and stock-in-trade
    description: Reported with the sign shown in the filing (a decrease in inventory is positive expense).
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:ChangesInInventoriesOfFinishedGoodsWorkInProgressAndStockInTrade"] }
    labels: ["Change in inventories of finished goods and work in progress"]
  employee_expense:
    label: Employee benefits expense
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:EmployeeBenefitExpense"], banking: ["in-capmkt:EmployeesCost"] }
    labels: ["Employee benefits expense"]
  finance_cost:
    label: Finance costs
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:FinanceCosts"] }
    labels: ["Finance costs"]
  depreciation_amortisation:
    label: Depreciation and amortisation expense
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:DepreciationDepletionAndAmortisationExpense"] }
    labels: ["Depreciation and amortisation expenses"]
  other_expenses:
    label: Other expenses
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:OtherExpenses"] }
    labels: ["Other expenses"]
  total_expenses:
    label: Total expenses
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:Expenses"] }
    labels: ["Total expenses"]
  exceptional_items:
    label: Exceptional items
    description: Reported with the sign shown in the filing (negative = a loss) in the real files.
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:ExceptionalItemsBeforeTax"], banking: ["in-capmkt:ExceptionalItems"] }
  profit_before_tax:
    label: Profit before tax
    description: Banking family uses ProfitLossFromOrdinaryActivitiesBeforeTax (HDFC Bank Q4 FY26 - PBT less TaxExpense equals the profit for the period).
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts:
      indas: ["in-capmkt:ProfitBeforeTax"]
      banking: ["in-capmkt:ProfitLossFromOrdinaryActivitiesBeforeTax"]
    labels: ["Profit before tax"]
  tax_expense:
    label: Tax expense
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:TaxExpense"], banking: ["in-capmkt:TaxExpense"] }
    labels: ["Total tax expense"]
  profit_after_tax:
    label: Profit for the period
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts:
      indas: ["in-capmkt:ProfitLossForPeriod"]
      banking: ["in-capmkt:ProfitLossForThePeriod"]
    labels: ["Profit for the period / year"]
  profit_continuing_ops:
    label: Profit for the period from continuing operations
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:ProfitLossForPeriodFromContinuingOperations"] }
  profit_discontinued_ops:
    label: Profit (loss) from discontinued operations after tax
    description: Signed as reported (a loss is negative).
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:ProfitLossFromDiscontinuedOperationsAfterTax"] }
  share_of_associates_jv:
    label: Share of profit (loss) of associates and joint ventures
    description: Equity-method share, added to profit after tax (not part of profit before tax). Signed as reported.
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts:
      indas: ["in-capmkt:ShareOfProfitLossOfAssociatesAndJointVenturesAccountedForUsingEquityMethod"]
      banking: ["in-capmkt:ShareOfProfitLossOfAssociates"]
  profit_attributable_owners:
    label: Profit attributable to owners of the parent
    description: Only consolidated filings with minority interests carry it (Gabriel); the banking family uses the profit after minority interest and associates.
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    zero_is_placeholder_while_nonzero: profit_after_tax   # tagged 0 beside a non-zero profit = not tagged
    xbrl_concepts:
      indas: ["in-capmkt:ProfitOrLossAttributableToOwnersOfParent"]
      banking: ["in-capmkt:ProfitLossAfterTaxesMinorityInterestAndShareOfProfitLossOfAssociates"]
  other_comprehensive_income:
    label: Other comprehensive income
    description: Both OtherComprehensiveIncome and OtherComprehensiveIncomeNetOfTaxes are tagged with equal values in every real filing; the second is a known duplicate and a differing value raises a review item.
    statement: profit_and_loss
    period_kind: duration
    unit: INR
    xbrl_concepts: { indas: ["in-capmkt:OtherComprehensiveIncome"] }
    labels: ["Total other comprehensive income net of tax"]
  eps_basic:
    label: Basic earnings per share
    description: Continuing and discontinued operations combined (banking - after extraordinary items).
    statement: profit_and_loss
    period_kind: duration
    unit: INR_PER_SHARE
    derivable: false  # weighted share counts differ between periods; never H2 = FY - H1
    xbrl_concepts:
      indas: ["in-capmkt:BasicEarningsLossPerShareFromContinuingAndDiscontinuedOperations"]
      banking: ["in-capmkt:BasicEarningsPerShareAfterExtraordinaryItems"]
  eps_diluted:
    label: Diluted earnings per share
    description: Continuing and discontinued operations combined (banking - after extraordinary items).
    statement: profit_and_loss
    period_kind: duration
    unit: INR_PER_SHARE
    derivable: false  # weighted share counts differ between periods; never H2 = FY - H1
    xbrl_concepts:
      indas: ["in-capmkt:DilutedEarningsLossPerShareFromContinuingAndDiscontinuedOperations"]
      banking: ["in-capmkt:DilutedEarningsPerShareAfterExtraordinaryItems"]

  # ---------------------------------------------------------------- balance sheet (instants)
  ppe:
