# PDF/OCR labels that are understood and deliberately not mapped, scoped by the statement of the
# page they were read on, so they never queue for review. Labels are in normalised form. Every
# label was seen in the Netweb Q4 FY26 results scan, or (2026-10-19) in the Gabriel and Netweb
# results PDFs; OCR-garbled labels are not catalogued (they are re-checked after the M03b run).
# Checked against the XBRL revision, a label is mapped only when it is unambiguous within its statement AND its value equals the XBRL value;
# 'NOT x' notes record the plausible-looking mappings that are wrong (fuzzy suggestions are never
# accepted automatically).
known_unmapped_labels:
  profit_and_loss:
    "profit before exceptional items and tax": { reason: subtotal, note: "equals profit_before_tax plus exceptional items" }
    "current tax": { reason: income_statement_item, note: "component of tax_expense" }
    "adjustment of tax relating to earlier period": { reason: income_statement_item, note: "component of tax_expense" }
    "deferred tax": { reason: income_statement_item, note: "component of tax_expense" }
    "re measurement gains on defined benefit plans": { reason: income_statement_item, note: "OCI line; the total is other_comprehensive_income" }
    "income tax relating to items that will not be reclassified to statement of profit and loss": { reason: income_statement_item, note: "OCI line" }
    "total comprehensive income for the period year": { reason: subtotal, note: "profit plus OCI; no concept in the starter list" }
    "paid up equity share capital": { reason: share_data, note: "footer of the P&L page, dated as a duration; the XBRL tag PaidUpValueOfEquityShareCapital is also share_data; the balance-sheet line is equity_share_capital" }
    "other equity": { reason: balance_sheet_item, note: "footer of the P&L page, dated as a duration; the balance-sheet line is other_equity" }
    "basic": { reason: income_statement_item, note: "earnings per share: a per-share value, the page unit (millions) must not scale it; XBRL carries eps_basic" }
    "diluted": { reason: income_statement_item, note: "earnings per share: a per-share value, the page unit (millions) must not scale it; XBRL carries eps_diluted" }
    "deferred tax charge": { reason: income_statement_item, note: "component of tax_expense" }
    "income tax relating to items that will not be reclassified to profit or loss": { reason: income_statement_item, note: "OCI line" }
    "total other comprehensive income for the period year": { reason: income_statement_item, note: "OCI total; the XBRL tag is other_comprehensive_income but no XBRL value equals this one, so it is not mapped from the PDF" }
    "other comprehensive income for the period year net of tax": { reason: income_statement_item, note: "OCI total (PAT plus OCI equals total comprehensive income in the column); not mapped from the PDF: no XBRL value to match" }
    "total comprehensive income for the period year net of tax": { reason: subtotal, note: "profit plus OCI; no concept in the starter list" }
    "remeasurement of post employment benefit obligations": { reason: income_statement_item, note: "OCI line" }
    "net gain on cash flow hedges": { reason: income_statement_item, note: "OCI line" }
