      banking: ["in-capmkt:CapitalAndLiabilities"]
    labels: ["Total equity and liabilities"]

  # ---------------------------------------------------------------- cash flow
  cfo:
    label: Net cash flows from operating activities
    statement: cash_flow
    period_kind: duration
    unit: INR
    xbrl_concepts:
      indas: ["in-capmkt:CashFlowsFromUsedInOperatingActivities"]
