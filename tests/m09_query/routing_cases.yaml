# Routing set (M09 acceptance 1): 81 questions about the watch list with the intent they must give.
#
# Rules of use
#   * Cases marked `held_out: true` (28) are never used to tune intents.yaml, the resolvers or the
#     classifier prompt. Tune against the others only; report held-out accuracy separately.
#   * `today` is the date the relative periods are resolved against; `latest_periods` is what the
#     real database holds (latest quarter, fiscal year) so the set is also run by the stubbed
#     tests without a database.
#   * expect.isin is the NSE symbol (GABRIEL, HDFCBANK, NETWEB), mapped to the ISIN by the runner.
#   * expect.metrics: metric IDs from metrics.yaml or taxonomy concept IDs.
#   * expect.periods: period labels, or "latest" (no period named: the default is applied).
#   * expect.forward_looking: true = a guidance / outlook question (narrative over the latest calls); expect.horizon:
#     the future periods it names (not filed, so they are not evidence); expect.periods are then the last actuals shown.
#   * expect.exploratory: true = no metric and no cue, searched in the filed results text (all sections, audit text included).
#   * expect.comparison: yoy | sequential | periods (two named periods) | trend | basis.
#   * expect.decision: confirm = answer but ask "Is this right?" (confidence between the
#     thresholds). Without it, proceed or confirm both pass.
#   * clarify: <reason> = the parser must return a Clarification, not an intent.
#   * A wrong intent shown above auto_proceed_threshold is "wrong-confident" and must be 0.
version: 1
today: 2026-10-19
latest_periods: { quarter: "Q1 FY27", fiscal_year: "FY26" }

cases:
  # ------------------------------------------------------------------ clean lookups
  - id: R01
